spring.application.name=rental-test

spring.datasource.url=jdbc:postgresql://localhost:5432/rental_test
spring.datasource.username=rental_user
spring.datasource.password=rental_password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Kafka consumer
spring.kafka.consumer.group-id=rentalops-test-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Commit offsets only after successful listener processing
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.kafka.listener.auto-startup=false