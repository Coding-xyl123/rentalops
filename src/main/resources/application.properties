
spring.application.name=rental

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rental}
spring.datasource.username=${DB_USERNAME:rental_user}
spring.datasource.password=${DB_PASSWORD:rental_password}

# JPA configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Cloud hosting configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true